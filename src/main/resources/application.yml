#port 결정 = default 8080 = 8081
#Egiex 80 / Jenkins : 8080
server:
  port: 9090
  servlet:
    context-path: /
spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
# Kafka로 메세지를 보내는 Producer 설정
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
# Key = String형태로 변환
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
# ChatMessage => 객체를 JSON형태로 변환 = Kafka로 전송
    consumer:
# 메세지를 읽은 Consumer 클래스 생성
      group-id: notification-group
# 저장된 Offset이 없으면 가장 오래된 메세지부터 읽는다
      auto-offset-reset: earliest
# Key = String형태로 변환
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
# JSON 변경
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: com.sist.web.vo
# Listener = JSON 역직렬화 역할
    listener:
# 메세지 1개 (record) 
      ack-mode: record
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver
  jpa:
    database: oracle
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        user_sql_comments: true
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:templates/
    suffix: .html
    mode: HTML
# mybatis
mybatis:
  type-aliases-package: com.sist.web.vo
  mapper-locations: mybatis/mapper/*.xml
# logging
logging: 
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
# security
# spring ai
# websocket = 카프카
